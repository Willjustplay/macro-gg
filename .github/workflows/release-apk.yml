name: Build & Publish Android Play Store

on:
  push:
    tags:
      - 'playstore-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. playstore-v1.0.0)'
        required: true
        default: 'playstore-v1.0.0'

permissions:
  contents: write

jobs:
  build-android-playstore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or generate debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > debug.keystore
            echo "Restored persistent debug keystore from GitHub secret."
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Android unit tests, R8 verification & build Android APK/AAB
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          PLAY_KEYSTORE_B64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:minifyReleaseWithR8 --no-configuration-cache

          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/Wjust-macro-Android-${TAG_NAME}-debug.apk"

          if [ -n "$PLAY_KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$PLAY_KEYSTORE_B64" | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="$PWD/my-upload-key.jks"
            ./gradlew :app:bundleRelease :app:assembleRelease --no-configuration-cache
            cp app/build/outputs/bundle/release/app-release.aab "release-assets/Wjust-macro-PlayStore-${TAG_NAME}.aab"
            cp app/build/outputs/apk/release/app-release.apk "release-assets/Wjust-macro-Android-${TAG_NAME}-release.apk"
          else
            ./gradlew :app:bundleDebug --no-configuration-cache
            cp app/build/outputs/bundle/debug/app-debug.aab "release-assets/Wjust-macro-PlayStore-${TAG_NAME}-debug.aab"
            echo "Note: Set PLAY_KEYSTORE_BASE64, PLAY_STORE_PASSWORD, and PLAY_KEY_PASSWORD secrets to produce a signed Play Store release .aab."
          fi

      - name: Upload Android Play Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android-playstore
          path: release-assets/*

  publish-release:
    needs: [build-android-playstore]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish Android GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          ls -lh dist/
          if gh release view "$TAG_NAME" -R "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* -R "$GH_REPO" --clobber
          else
            gh release create "$TAG_NAME" dist/* -R "$GH_REPO" \
              --title "Wjust macro Play Store ${TAG_NAME} (Android)" \
              --generate-notes
          fi
