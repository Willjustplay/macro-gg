name: Build & Publish Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.17.0)'
        required: true
        default: 'v2.17.0'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or generate persistent debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > debug.keystore
            echo "Restored persistent signing keystore from GitHub secret."
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Android tests & build Android APKs / AAB
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :player:testDebugUnitTest \
            :app:assembleDebug :player:assembleDebug :player:bundleDebug :export-bridge:assembleDebug \
            -PappVersion="${TAG_NAME}" --no-configuration-cache

      - name: Stage Android release artifacts
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/Wjust-macro-${TAG_NAME}.apk"
          cp player/build/outputs/apk/debug/player-debug.apk "release-assets/Wjust-Player-Android-${TAG_NAME}.apk"
          cp player/build/outputs/bundle/debug/player-debug.aab "release-assets/Wjust-Player-PlayStore-${TAG_NAME}-debug.aab"
          cp export-bridge/build/outputs/apk/debug/export-bridge-debug.apk "release-assets/Wjust-Export-Bridge.apk"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/*

  publish-release:
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          ls -lh dist/
          if gh release view "$TAG_NAME" -R "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* -R "$GH_REPO" --clobber
          else
            gh release create "$TAG_NAME" dist/* -R "$GH_REPO" \
              --title "Wjust macro ${TAG_NAME} (Android)" \
              --generate-notes
          fi
